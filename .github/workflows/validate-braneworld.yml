name: Validate Voltron Braneworld

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall braneworld ai tests
      - name: Run tests
        run: python -m pytest -q

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check runtime
        working-directory: runtime
        run: cargo check
